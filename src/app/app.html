<header class="site-header">
  <h1>Sight-reading generator</h1>
  <p class="tagline">A new piano piece for Grades 1–5, every time.</p>
</header>

<section class="toolbar" aria-label="Piece settings">
  <div class="field">
    <span class="field-label" id="grade-label">Grade</span>
    <div class="segmented" role="radiogroup" aria-labelledby="grade-label">
      @for (g of grades; track g) {
        <button
          type="button"
          role="radio"
          [attr.aria-checked]="grade() === g"
          [class.selected]="grade() === g"
          (click)="setGrade(g.toString())"
        >
          {{ g }}
        </button>
      }
    </div>
  </div>

  <label class="field">
    <span class="field-label">Style</span>
    <select [value]="style()" (change)="setStyle($any($event.target).value)">
      @for (s of styles; track s.id) {
        <option [value]="s.id" [selected]="s.id === style()">{{ s.name }}</option>
      }
    </select>
  </label>

  <label class="field">
    <span class="field-label">Key</span>
    <select (change)="setKey($any($event.target).value)">
      <option value="" [selected]="!settings().keyId">Random</option>
      @for (k of keyOptions(); track k.id) {
        <option [value]="k.id" [selected]="k.id === settings().keyId">{{ k.name }}</option>
      }
    </select>
  </label>

  <label class="field">
    <span class="field-label">Time</span>
    <select (change)="setTime($any($event.target).value)">
      <option value="" [selected]="!settings().timeId">Random</option>
      @for (t of timeOptions(); track t) {
        <option [value]="t" [selected]="t === settings().timeId">{{ t }}</option>
      }
    </select>
  </label>

  <div class="actions">
    <button type="button" class="primary" (click)="newPiece()">New piece</button>
    <button type="button" (click)="togglePlay()" [attr.aria-pressed]="playback.playing()">
      @if (playback.loading()) {
        Loading piano…
      } @else if (playback.playing()) {
        ■ Stop
      } @else {
        ▶ Play
      }
    </button>
    <button type="button" (click)="print()">Print</button>
  </div>

  <label class="field tempo">
    <span class="field-label">Tempo {{ beatLabel() }} = {{ bpm() }}</span>
    <input
      type="range"
      [min]="tempoRange().min"
      [max]="tempoRange().max"
      [value]="bpm()"
      (input)="setBpm($any($event.target).value)"
    />
  </label>
</section>

@if (playback.usingSynth()) {
  <p class="notice">Piano samples could not be loaded, so playback is using a simple synthesiser.</p>
}

<main class="sheet">
  <header class="sheet-header">
    <h2>{{ piece().title }}</h2>
    <p class="sheet-meta">
      <span>{{ subtitle() }}</span>
      <span class="seed">Seed {{ piece().seed }}</span>
    </p>
  </header>
  <app-score [piece]="piece()" [activeBar]="playback.currentBar()" />
</main>
